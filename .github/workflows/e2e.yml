name: Browser journeys

on:
  pull_request:
  push:
    branches: [main]

jobs:
  native-host:
    name: Compile native host
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Type-check AppKit and WebKit host
        run: >-
          swiftc -typecheck -warnings-as-errors
          -target "$(uname -m)-apple-macos13.0"
          -framework AppKit -framework WebKit
          packaging/macos-review/native_host.swift
      - name: Validate app metadata
        run: plutil -lint packaging/macos-review/Info.plist

  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:security
      - run: pnpm check
      - run: pnpm test:native
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
