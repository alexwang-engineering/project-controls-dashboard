name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    # GitHub code scanning is unavailable while this portfolio repository is
    # private on the current account plan. Keep the workflow ready so it starts
    # protecting the default branch automatically if the repository is made
    # public after its release audit.
    if: github.event.repository.private == false
    name: Analyse JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
